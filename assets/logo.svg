<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <!-- Northbound Emblem (Compass + S + Brass Star) -->
  <g transform="translate(10, 10)">
    <!-- Outer Compass Ring -->
    <circle cx="50" cy="50" r="46" stroke="#0F1E33" stroke-width="4.5" fill="none" />
    <circle cx="50" cy="50" r="41" stroke="#EDE6D6" stroke-width="1.2" stroke-dasharray="2 3" fill="none" />
    
    <!-- Compass Cardinal Tick Marks -->
    <line x1="50" y1="4" x2="50" y2="12" stroke="#0F1E33" stroke-width="2.5" />
    <line x1="50" y1="88" x2="50" y2="96" stroke="#0F1E33" stroke-width="2.5" />
    <line x1="4" y1="50" x2="12" y2="50" stroke="#0F1E33" stroke-width="2.5" />
    <line x1="88" y1="50" x2="96" y2="50" stroke="#0F1E33" stroke-width="2.5" />

    <!-- Horizon Line -->
    <line x1="16" y1="50" x2="84" y2="50" stroke="#0F1E33" stroke-width="2.2" opacity="0.8" />

    <!-- Rising S Letterform -->
    <path d="M62 31 C59 23 41 22 39 31 C37 40 63 41 61 58 C59 71 40 73 35 64" 
          stroke="#0F1E33" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Brass Star at True North -->
    <g transform="translate(50, 4)">
      <!-- 4-point faceted star -->
      <polygon points="0,-10 3,-3 10,0 3,3 0,10 -3,3 -10,0 -3,-3" fill="#B98A3E" />
      <circle cx="0" cy="0" r="1.5" fill="#0F1E33" />
    </g>
  </g>

  <!-- Typography: SHAW GLOBAL VENTURES -->
  <!-- Main Name -->
  <text x="135" y="58" font-family="'Source Serif 4', 'Georgia', serif" font-size="34" font-weight="600" fill="#0F1E33" letter-spacing="1.5">
    SHAW GLOBAL
  </text>
  
  <!-- Meridian Brass Divider Rule -->
  <line x1="135" y1="71" x2="480" y2="71" stroke="#B98A3E" stroke-width="2.2" />

  <!-- Sub-wordmark: VENTURES -->
  <text x="137" y="93" font-family="'IBM Plex Sans', -apple-system, sans-serif" font-size="15" font-weight="600" fill="#0F1E33" letter-spacing="9">
    VENTURES
  </text>
  
  <text x="365" y="93" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="500" fill="#1E6B66" letter-spacing="1.5">
    INC. • DBA GES
  </text>
</svg>
